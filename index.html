<body>
  <div class="grain"></div>
  <header id="topbar" class="topbar"></header>
  <main id="app" class="app-shell"></main>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script>
// Show the actual script URL and line instead of an unhelpful generic error.
(function () {
  function show(message, source, line, column) {
    const host = document.getElementById('app');
    if (!host || host.textContent.trim()) return;
    const section = document.createElement('section');
    section.className = 'panel';
    const title = document.createElement('h2');
    title.textContent = 'Ошибка интерфейса';
    const detail = document.createElement('pre');
    detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere';
    detail.textContent = [message, source ? 'Файл: ' + source : '', line ? 'Строка: ' + line + (column ? ', столбец: ' + column : '') : ''].filter(Boolean).join('\n');
    const link = document.createElement('a');
    link.href='/setup';link.className='soft-button';link.textContent='Открыть диагностику';
    section.append(title,detail,link);host.replaceChildren(section);
  }
  window.addEventListener('error', e => {
    if (e.target && e.target !== window && e.target.tagName === 'SCRIPT') {
      show('Не удалось загрузить скрипт', e.target.src);return;
    }
    show(String(e.message || 'Неизвестная ошибка'),e.filename,e.lineno,e.colno);
  }, true);
  window.addEventListener('unhandledrejection', e => show(String(e.reason?.stack || e.reason?.message || e.reason || 'Неизвестная ошибка')));
})();
</script>
